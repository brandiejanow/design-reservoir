name: Clear stalled Pages deployment
on:
  push:
    paths:
      - .github/workflows/clear-stalled-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/94b6c1723c8018a61f42800bb38d54f84bf54c53/cancel"
