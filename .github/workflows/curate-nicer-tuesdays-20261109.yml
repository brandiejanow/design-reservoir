name: Curate Nicer Tuesdays 2026-11-09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-nicer-tuesdays-20261109.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reservoir-nicer-tuesdays-20261109
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and apply reviewed records
        run: |
          python3 - <<'PY'
          import csv, io, json, hashlib, datetime
          from pathlib import Path
          from urllib.parse import urlsplit
          date = '2026-11-09'
          audit_path = Path('data/nicer-tuesdays-review-2026-11-09.json')
          assert not audit_path.exists(), 'Already applied; refusing duplicate import'
          expected = {'data/resources.csv':'2c66d70d6d10e7f531797143d593d57f1fef5159','data/events.csv':'fb169fc69f6e945222cf0a2246140bbe2c8032af','README.md':'ac0e796da65708c2ce1ea37c5510b4c3a1b30ff7'}
          original = {p:Path(p).read_bytes() for p in expected}
          for p,b in original.items():
              sha = hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert sha == expected[p], f'{p} changed since review; stop rather than overwrite concurrent work'
          def parsed(b):
              rows = list(csv.reader(io.StringIO(b.decode('utf-8'), newline='')))
              assert rows and all(len(r) == len(rows[0]) for r in rows if r), 'CSV schema mismatch'
              return rows[0], [dict(zip(rows[0],r)) for r in rows[1:] if r]
          rh, rr = parsed(original['data/resources.csv'])
          eh, er = parsed(original['data/events.csv'])
          wb = Path('data/design-weeks.csv').read_bytes()
          _, wr = parsed(wb)
          assert (len(rr), len(er), len(wr)) == (498,121,76)
          assert rh == 'name,description,url,resource_type,industries,keywords,status,last_checked,audit_note,previous_url,source'.split(',')
          assert eh == 'start_date,end_date,name,city,country,region,category,description,url,source,keywords'.split(',')
          assert not any('nicer tuesdays' in r['name'].casefold() or urlsplit(r['url']).hostname == 'nicertuesdays.itsnicethat.com' for r in rr), 'Continuing series already represented'
          assert not any('nicer tuesdays' in r['name'].casefold() or '2003059500888' in r['url'] for r in er), 'Event already represented'
          resource = {
              'name':'Nicer Tuesdays: Creative Talks Archive',
              'description':'Continuing talks series and public recording archive from It\'s Nice That, documenting graphic design, illustration, photography, film, publishing and creative practice. The archive offers filters by discipline, theme, city and year, with transcripts on inspected talk pages. Useful for teaching and studying practitioners\' accounts of projects; these are editorially selected presentations rather than peer-reviewed research.',
              'url':'https://nicertuesdays.itsnicethat.com/archive',
              'resource_type':'Archive & Collection; Media & Publications; Conference & Professional Gathering',
              'industries':'Graphic & Communication Design; Creative Industries; Design Education; Research, History & Education; Cross-disciplinary Design',
              'keywords':'Nicer Tuesdays; It\'s Nice That; creative talks; design process; graphic design; illustration; photography; independent publishing; book design; creative practice; recordings; transcripts; oral accounts; London; New York; Los Angeles',
              'status':'Verified source',
              'last_checked':date,
              'audit_note':'Official series homepage, About, archive, an individual transcript, organizer event page and publisher terms inspected. Series began in 2013; archive lists material through 2026 and a confirmed November 10, 2026 LA program demonstrates current activity. Archive currently reports 597 talks, a publisher-reported count not independently enumerated. Parallel Press talk page dated June 2, 2026 provides a transcript warning of errors; statements should be checked against recordings and original evidence. Video playback and every archive item were not tested. Public browsing does not grant an open reuse license; publisher reserves rights in its and third-party content. Live attendance is ticketed and distinct from archived material. No promise of a recording or livestream for each future event. No individual talk, news article or speaker added as a separate resource.',
              'previous_url':'',
              'source':'https://nicertuesdays.itsnicethat.com/; https://nicertuesdays.itsnicethat.com/about; https://nicertuesdays.itsnicethat.com/archive; https://nicertuesdays.itsnicethat.com/talks/parallel-press-2-june-2026; https://www.itsnicethat.com/terms-conditions'
          }
          event = {
              'start_date':'2026-11-10',
              'end_date':'2026-11-10',
              'name':'Nicer Tuesdays LA: November 2026',
              'city':'Los Angeles',
              'country':'United States',
              'region':'North America',
              'category':'Graphic & Communication Design',
              'description':'It\'s Nice That professional talks at Lodge Room with Micaiah Carter on photography, Bijou Karman on illustration and self-publishing, and Debbie Millman in conversation with Meg Farmer about design and interviewing. Detailed organizer text and venue specify doors at 7 p.m. and talks around 7:30 p.m. Pacific; headline hours differ. Ticketed in person; price and remaining availability unverified. Eventbrite says 18+ with ID, while the venue says all ages; confirm admission with the organizer. No livestream or session recording confirmed.',
              'url':'https://nicertuesdays.itsnicethat.com/events/10-november-2026-la',
              'source':'Official Nicer Tuesdays dated event page, It\'s Nice That announcement dated October 16, 2026, Lodge Room venue listing and indexed exact Eventbrite event 2003059500888 reviewed November 9, 2026. https://www.itsnicethat.com/articles/nicer-tuesdays-november-la-launch-161026; https://www.lodgeroomhlp.com/shows/nicer-tuesdays-la/; https://www.eventbrite.co.uk/e/nicer-tuesdays-la-november-tickets-2003059500888 Direct Eventbrite retrieval returned 429; registration inventory not tested. Event page header says 6:30-10 p.m., detailed text says doors 7 p.m./talks 7:30 p.m., and indexed Eventbrite says 7-9 p.m.; no definitive finish time asserted. Scheduled event, not a completion claim.',
              'keywords':'Nicer Tuesdays; It\'s Nice That; Debbie Millman; Micaiah Carter; Bijou Karman; Meg Farmer; Design Matters; graphic design; photography; illustration; self publishing; zines; interviews; creative practice; Los Angeles; Lodge Room'
          }
          assert set(resource) == set(rh) and set(event) == set(eh)
          assert '\u2014' not in resource['description'] + event['description']
          assert datetime.date.fromisoformat(event['end_date']) >= datetime.date.fromisoformat(date)
          def append(b, head, row):
              assert b.endswith(b'\n'), 'Expected final newline to preserve existing records byte-for-byte'
              out = io.StringIO(newline='')
              csv.writer(out,lineterminator='\n').writerow([row[k] for k in head])
              result = b + out.getvalue().encode('utf-8')
              assert result.startswith(b)
              parsed(result)
              return result
          updated = {'data/resources.csv':append(original['data/resources.csv'],rh,resource),'data/events.csv':append(original['data/events.csv'],eh,event)}
          assert len(parsed(updated['data/resources.csv'])[1]) == 499
          assert len(parsed(updated['data/events.csv'])[1]) == 122
          readme = original['README.md'].decode('utf-8')
          replacements = [('**498 core resource records**','**499 core resource records**'),('**498 active research and reference resource records**','**499 active research and reference resource records**'),('**574 searchable entries**','**575 searchable entries**'),('**121 current or forthcoming dated global events**','**122 current or forthcoming dated global events**')]
          for old,new in replacements:
              assert readme.count(old) == 1, f'Missing or ambiguous README count: {old}'
              readme = readme.replace(old,new,1)
          updated['README.md'] = readme.encode('utf-8')
          before = {'resources':len(rr),'research_tools':sum('Research Tool' in r['resource_type'].split('; ') for r in rr),'design_weeks':len(wr),'events':len(er),'searchable_entries':len(rr)+len(wr)}
          after = dict(before,resources=499,events=122,searchable_entries=575)
          audit = {
              'review_date':date,
              'submitted_url':'https://www.eventbrite.co.uk/e/nicer-tuesdays-la-november-tickets-2003059500888',
              'decision':'Add one continuing creative-practice archive and one verified dated professional event, preserving the distinction between practitioner testimony and scholarly findings.',
              'before':before,'after':after,'resource':resource,'event':event,
              'verification':{
                  'provenance':'The original organizer explicitly confirms November 10, 2026, the venue and all three speakers. Its October 16 launch announcement and venue cross-reference the exact submitted Eventbrite ID. This is not the separate November 4, 2025 LA event.',
                  'current_operation':'Official forthcoming program and dated 2026 talk entries support continuing operation. Neither HTTP status nor a ticket link alone establishes an event will occur.',
                  'archive':'Reviewed current archive and one source-linked transcript. The public archive provides date, speaker and project context. Its 597-talk count is reported by the publisher, not independently recounted. No claim that all transcripts or speaker assertions have been fact-checked.',
                  'access':'Public archive pages were readable without registration; no account, purchase, newsletter signup or booking was performed. Direct Eventbrite retrieval failed with 429, but the exact indexed organizer listing was readable.',
                  'rights':'Publisher terms reserve rights for It\'s Nice That and third-party owners. No blanket open license established. Only original descriptions and source links added; no recordings, images, transcripts or full article text copied.',
                  'live_site':'Attempts to retrieve the live Reservoir homepage and calendar through the browser failed. Repository source verification does not constitute a live interaction or display test.'
              },
              'unresolved':[
                  'Headline time range on the event microsite (6:30-10 p.m.) conflicts with its own detailed text and venue (doors 7 p.m.; talks 7:30 p.m.) and indexed Eventbrite (7-9 p.m.). No definitive closing time recorded.',
                  'Indexed Eventbrite says 18+ with ID; venue says all ages. Organizer confirmation needed for admission.',
                  'Ticket price and live availability not verified. Venue extraction contains both SOLD OUT and LAST CALL labels, whose active display state was not established; no availability claim inferred.',
                  'No confirmed livestream or publication commitment for this particular session. Existing archive does not guarantee a new recording.',
                  'Transcript accuracy and video playback were not independently evaluated.'
              ],
              'not_added':['Individual promotional article','Separate records for speakers or sampled talks','Unverified ticket price or availability','The completed November 2025 LA edition'],
              'changes':{'resources_added':1,'events_added':1,'resources_removed':0,'events_removed':0,'duplicates_added':0,'website_code_changed':False,'design_weeks_changed':False},
              'previous_events_with_recorded_end_before_review':[{'name':r['name'],'end_date':r['end_date']} for r in er if r['end_date'] and r['end_date'] < date],
              'retirement':'Existing daily expiration should remove this event after November 10, 2026; the archive stays in the continuing directory and earlier events remain in Git history.',
              'validation':'Exact pre-review blob checks passed. Full current CSV inventories parsed, schemas and name/domain/event-ID duplicates checked. All prior resource and event bytes preserved. Four README count tokens updated. Design Weeks, research-tool classifications, Atlas and website code unchanged.',
              'sha256_after':{p:hashlib.sha256(b).hexdigest() for p,b in updated.items()}
          }
          for p,b in updated.items():Path(p).write_bytes(b)
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert Path('data/design-weeks.csv').read_bytes() == wb
          print(json.dumps({'before':before,'after':after,'changes':audit['changes']},indent=2))
          PY
      - name: Commit only reviewed additions and accounting
        run: |
          git diff --check
          git add data/resources.csv data/events.csv README.md data/nicer-tuesdays-review-2026-11-09.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish Nicer Tuesdays creative-talk archive and verified November 10 LA listing'
          git push origin HEAD:main
