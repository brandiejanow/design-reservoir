name: Apply verified RTD curation 2026-11-05
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curate-rtd-20261105.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: curate-rtd-20261105
  cancel-in-progress: false
jobs:
  curate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and apply verified records
        run: python3 scripts/import_rtd_20261105.py
      - name: Commit reviewed data and count updates
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.csv data/events.csv data/curation-review.csv data/rtd-review-2026-11-05.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified RTD archive, 2027 dates and submission deadline; retire elapsed events'
            git push origin HEAD:main
          fi
