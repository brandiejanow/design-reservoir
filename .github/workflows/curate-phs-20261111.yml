name: Curate PHS and Philadelphia Flower Show 2026-11-11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-phs-20261111.yml']
permissions:
  contents: write
concurrency:
  group: reservoir-phs-20261111
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source-reviewed records with concurrent-edit guards
        run: |
          python3 - <<'PY'
          import csv, io, json, hashlib, datetime, subprocess
          from pathlib import Path
          date = '2026-11-11'
          rp, ep, mdp, wp = map(Path, ['data/resources.csv','data/events.csv','README.md','data/design-weeks.csv'])
          ap = Path('data/phs-review-2026-11-11.json')
          assert not ap.exists(), 'Review already applied'
          expected = {rp:'f00815e1439c103e34691c894bb30b80df99d9ef',ep:'7a6a3624a02ed7cf933ab1d3531b42ef1b4e19f3',mdp:'0c1fc242f963ff8e8edc186a2f7b230225d3f02f'}
          original = {p:p.read_bytes() for p in [rp,ep,mdp,wp]}
          for p, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha, f'Concurrent change: {p}'
          def parse(text):
              rows=list(csv.reader(io.StringIO(text,newline='')))
              header=rows[0]
              body=[r for r in rows[1:] if r and r[0].strip()]
              assert all(len(r)==len(header) for r in body), 'CSV schema mismatch'
              return header,[dict(zip(header,r)) for r in body]
          rt,et,md=(original[p].decode('utf-8') for p in [rp,ep,mdp])
          rh,resources=parse(rt)
          eh,events=parse(et)
          _,weeks=parse(original[wp].decode('utf-8'))
          assert len(resources)==502 and len(events)==121 and len(weeks)==76
          assert rh=='name,description,url,resource_type,industries,keywords,status,last_checked,audit_note,previous_url,source'.split(',')
          assert eh=='start_date,end_date,name,city,country,region,category,description,url,source,keywords'.split(',')
          resource={
              'name':'Pennsylvania Horticultural Society (PHS): Landscape Programs and McLean Library',
              'description':"Philadelphia-based nonprofit connecting landscape and garden practice with public education, community gardens, tree stewardship, vacant-land maintenance and university research partnerships. Its McLean Library provides horticultural references, digitized visual collections and finding aids for organizational records. LandCare documents delivery methods and links to published evaluation studies. A reference for landscape design, environmental learning, institutional archives and long-term neighborhood stewardship.",
              'url':'https://phsonline.org/',
              'resource_type':'Education & Research; Research & Reference; Archive & Collection; Community & Network',
              'industries':'Architecture & Built Environment; Ecological, Bio & Regenerative; Arts & Cultural Heritage; STEAM; Research, History & Education',
              'keywords':'Pennsylvania Horticultural Society; PHS; McLean Library; landscape design; garden history; horticulture; botanical illustration; digital collections; institutional archives; LandCare; public gardens; community gardens; tree stewardship; urban greening; maintenance; university research; environmental education; Philadelphia; Pennsylvania',
              'status':'Verified source',
              'last_checked':date,
              'audit_note':"Official homepage, McLean Library, LandCare model and impact pages, June 16, 2026 program expansion, Flower Show program and terms reviewed. Library reading resources are distinct from member borrowing and appointment-based historical collection access. Digital collection and finding-aid links were confirmed on the library page, but their external destinations returned 429 and 403; item browsing and downloads were not tested. New navigation paths were unavailable, while established official pages remained readable. A linked 2018 JAMA Network Open cluster randomized trial was inspected in HTML for design, results and limitations: its self-reported outcomes and Philadelphia setting do not validate every PHS claim or establish effects elsewhere. Overall poor-mental-health reduction was not statistically significant; no unqualified health percentages reproduced. The newer 2025-2026 program-evaluation PDF was linked but not reviewed. PHS reserves website and media rights; collection items and scholarly articles have separate terms, including CC BY for the inspected JAMA paper. No blanket reuse license, data download, registration or independent outcome replication. No standalone articles, library events or supplier listings added.",
              'previous_url':'',
              'source':'https://phsonline.org/; https://phsonline.org/for-gardeners/phs-mclean-library-and-online-resource-center; https://phsonline.org/programs/transforming-vacant-land/how-it-works; https://phsonline.org/programs/transforming-vacant-land/our-impact; https://phsonline.org/phs-news/pennsylvania-horticultural-society-phs-expands-its-vacant-lot-greening-program-phs-landcare-into-chester-pennsylvania; https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2688343; https://phsonline.org/terms-of-use'
          }
          event={
              'start_date':'2027-03-13',
              'end_date':'2027-03-21',
              'name':'PHS Philadelphia Flower Show 2027: ICONIC',
              'city':'Philadelphia',
              'country':'United States',
              'region':'North America',
              'category':'Ecological, Bio & Regenerative',
              'description':"Ticketed horticultural and landscape-design exhibition at the Pennsylvania Convention Center. The 2027 theme, ICONIC, examines gardens' influence across art, design, fashion, food, film and architecture, with a planned Pennsylvania public-gardens showcase. General-public dates are March 13-21; March 12 is a members-only preview, not general admission. Daily hours and ticket categories differ. A public exhibition and fundraiser, not a scholarly conference; no livestream confirmed.",
              'url':'https://phsonline.org/the-flower-show/',
              'source':"Official PHS 2027 theme, show overview, FAQ and ticket page reviewed November 11, 2026. https://phsonline.org/the-flower-show/about-the-show/iconic; https://phsonline.org/the-flower-show/plan-your-visit/faq; https://phsonline.org/the-flower-show/buy-tickets/ Older overview includes March 12 in headline dates, but explicitly identifies it as Members' Preview Day; current FAQ and indexed overview confirm March 13-21 public admission. Scheduled program, not confirmation of occurrence. Ticket checkout, live inventory and final exhibitor roster not tested. Original summary and links only; no media reproduced.",
              'keywords':'PHS; Philadelphia Flower Show; ICONIC; landscape design; garden design; horticulture; public gardens; botanical culture; floral design; exhibitions; art; fashion; architecture; Pennsylvania Convention Center; 2027'
          }
          checks=['phsonline.org','pennhort','pennsylvania horticultural','mclean library']
          assert not any(any(s in str(r).lower() for s in checks) for r in resources), 'Potential existing PHS coverage; manual reconciliation required'
          assert not any('philadelphia flower show' in e['name'].lower() or 'phsonline.org/the-flower-show' in e['url'].lower() for e in events), 'Potential duplicate Flower Show'
          assert set(resource)==set(rh) and set(event)==set(eh)
          assert '\u2014' not in resource['description']+event['description']
          expired=[]
          for e in events:
              start=datetime.date.fromisoformat(e['start_date'])
              end=datetime.date.fromisoformat(e['end_date'] or e['start_date'])
              assert start<=end
              if end<datetime.date.fromisoformat(date): expired.append(e['name'])
          assert not expired, f'Elapsed events require separate reconciliation: {expired}'
          def append(text,header,row):
              out=io.StringIO(newline='')
              csv.writer(out,lineterminator='\n').writerow([row[k] for k in header])
              return text+('' if text.endswith('\n') else '\n')+out.getvalue()
          nrt,net=append(rt,rh,resource),append(et,eh,event)
          _,nr=parse(nrt)
          _,ne=parse(net)
          assert nrt.startswith(rt) and net.startswith(et)
          assert nr[:-1]==resources and ne[:-1]==events
          tools=sum('Research Tool' in [v.strip() for v in r['resource_type'].split(';')] for r in resources)
          before={'core_resources':len(resources),'research_tools':tools,'design_weeks':len(weeks),'dated_events':len(events),'searchable_entries':len(resources)+len(weeks)}
          after=dict(before,core_resources=len(nr),dated_events=len(ne),searchable_entries=len(nr)+len(weeks))
          for old,new in [('**502 core resource records**','**503 core resource records**'),('**502 active research and reference resource records**','**503 active research and reference resource records**'),('**578 searchable entries**','**579 searchable entries**'),('**121 current or forthcoming dated global events**','**122 current or forthcoming dated global events**')]:
              assert md.count(old)==1, f'Unexpected README count: {old}'
              md=md.replace(old,new,1)
          audit={
              'review_date':date,
              'submitted_url':'https://phsonline.org/',
              'decision':'Add one continuing institution and archival-resource entry, plus one dated Flower Show exhibition. Preserve distinction between educational resources, operational programs and scholarly evaluations.',
              'before':before,'after':after,'resource':resource,'event':event,
              'verification':{
                  'provenance':'Official institutional pages establish PHS stewardship, library services and LandCare delivery. Current 2026 programs, a dated June 2026 expansion announcement and the confirmed 2027 exhibition establish ongoing activity beyond URL reachability.',
                  'research':'The original 2018 JAMA Network Open paper, DOI 10.1001/jamanetworkopen.2018.0298, describes randomized comparisons of greening, cleanup and no intervention, with PHS implementing treatments. Methods, abstract, results and limitations inspected in HTML. Self-reported outcomes, attrition, study setting and nonsignificant overall poor-mental-health result limit broad claims. No reanalysis, new medical recommendation or assertion that findings transfer to other countries.',
                  'archives':'Official library description distinguishes catalog access, digitized collections, organizational finding aids, membership borrowing and historical research appointments. External collections were not independently browsed because retrieval was restricted.',
                  'event':'Public dates March 13-21, 2027 and member preview March 12 are reconciled against the official FAQ. Theme and showcase are announced plans. Older 2026 exhibitors navigation is not a confirmed 2027 lineup. No booking or availability claim.',
                  'licensing':'PHS website terms reserve rights and require permission for republication except where an item grants permission. The inspected JAMA article separately uses CC BY. This does not license PHS imagery, archives or other third-party components.',
                  'live_site':'Direct live Reservoir homepage and calendar retrieval failed. Existing page structures are retained; no independent browser display or search test claimed.'
              },
              'research_benchmark':'Evaluate how a public flagship event relates to year-round delivery, maintenance, education, institutional records and separately designed outcome studies. Preserve administrative and program records alongside visual documentation; distinguish outputs, stewardship and measured effects rather than assuming event visibility demonstrates institutional continuity. This is a proposed analytical application, not a finding about another country or sector.',
              'unresolved':['PHS new navigation paths could not be retrieved; established official pages remained accessible.','External McLean digital collections and finding aids were not independently inspected.','The 2025-2026 LandCare evaluation PDF and all underlying datasets were not reviewed.','Flower Show checkout, remaining ticket inventory, final exhibitor list and livestream availability not verified.','No audit of event revenues, funding allocations or institutional impact across all PHS programs.'],
              'excluded':['Separate permanent entry for each PHS program or library guide','Individual gardening articles and short events','March 12 member preview represented as general-public admission','Unqualified transfer of health effects or rights from a study to all PHS programs'],
              'changes':{'resources_added':1,'events_added':1,'resources_removed':0,'events_removed':0,'duplicates_added':0,'design_weeks_changed':False,'website_code_changed':False},
              'validation':'Current resource, event and README blob guards passed. Full CSV inventories parsed for schema, counts, relevant names/domains and elapsed end dates. Existing resource and event bytes preserved; four README count tokens updated. No link-check result treated as evidence of event occurrence or cancellation.',
              'sha256_after':{'data/resources.csv':hashlib.sha256(nrt.encode()).hexdigest(),'data/events.csv':hashlib.sha256(net.encode()).hexdigest(),'README.md':hashlib.sha256(md.encode()).hexdigest()}
          }
          rp.write_bytes(nrt.encode('utf-8'))
          ep.write_bytes(net.encode('utf-8'))
          mdp.write_bytes(md.encode('utf-8'))
          ap.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert wp.read_bytes()==original[wp]
          print(json.dumps({'before':before,'after':after,'expired_events':expired},indent=2))
          PY
      - name: Commit only reviewed records and counts
        run: |
          git diff --check
          git add data/resources.csv data/events.csv README.md data/phs-review-2026-11-11.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Index PHS landscape research and McLean archives; add 2027 Flower Show public dates'
          git push origin HEAD:main
