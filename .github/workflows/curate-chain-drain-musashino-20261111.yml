name: Curate Chain Drain and Musashino 2026-11-11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-chain-drain-musashino-20261111.yml']
permissions:
  contents: write
concurrency:
  group: reservoir-chain-drain-musashino-20261111
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate current inventories and publish reviewed records
        run: |
          python3 - <<'PY'
          import csv, io, json, hashlib, datetime, subprocess
          from pathlib import Path
          date = '2026-11-11'
          rp, ep, mdp = map(Path, ['data/resources.csv', 'data/events.csv', 'README.md'])
          review_path = Path('data/chain-drain-musashino-review-2026-11-11.json')
          assert not review_path.exists(), 'Already applied'
          expected = {rp:'3c34bcda311b428595a1f86c612186212a1c253d', ep:'3fbe86942067d9c172de5bda9a480a7f08a7fae7', mdp:'26b00d17fa0e059ed378e006c4740b4636f50216'}
          original = {p:p.read_bytes() for p in expected}
          for p, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == sha, f'Concurrent change: {p}'
          def parse(text):
              rows = list(csv.reader(io.StringIO(text,newline='')))
              head, body = rows[0], [r for r in rows[1:] if r and r[0].strip()]
              assert all(len(r)==len(head) for r in body), 'CSV schema mismatch'
              return head, [dict(zip(head,r)) for r in body]
          rt, et, md = (original[p].decode('utf-8') for p in [rp,ep,mdp])
          rh, resources = parse(rt)
          eh, events = parse(et)
          _, weeks = parse(Path('data/design-weeks.csv').read_text(encoding='utf-8'))
          assert len(resources)==501 and len(events)==123 and len(weeks)==76
          assert rh == 'name,description,url,resource_type,industries,keywords,status,last_checked,audit_note,previous_url,source'.split(',')
          assert eh == 'start_date,end_date,name,city,country,region,category,description,url,source,keywords'.split(',')
          resource = {
              'name':'Chain Drain: Built Environment White Paper and Research Database',
              'description':"Bryan Boyer and Greg Lindsay's University of Michigan white paper and accompanying company database examine losses of information and value between architecture, engineering, construction and operations. Combines practitioner interviews, four futures scenarios and source-linked company dossiers comparing digital automation with changes to the division of work. A reference for institutional learning, built-environment strategy and exploratory sector mapping. Company promises and AI-assisted classifications are not independently verified performance outcomes.",
              'url':'https://www.bryanboyer.com/chaindrain/',
              'resource_type':'Research Report; Research & Reference; Index & Directory',
              'industries':'Architecture & Built Environment; Futures & Foresight; Design Management & Business; Academic Research; Research, History & Education',
              'keywords':'Chain Drain; Bryan Boyer; Greg Lindsay; University of Michigan; Taubman College; AECO; architecture; construction; operations; institutional learning; knowledge transfer; supply chain; scenarios; strategic design; organizational research; AI-assisted research; company database',
              'status':'Verified source',
              'last_checked':date,
              'audit_note':"Author project and current database, selected PDF text, indexed Michigan repository record and Taubman College research coverage reviewed November 11, 2026. Database reports 501 companies/products and a November 8 update; older indexed pages contain smaller samples, so figures must be tied to a version. No independent full-database recount or performance evaluation. The report's main context is the US built environment; scenarios are analytical alternatives, not forecasts. DOI deposit identifies a white paper, not proof of peer review. Dossiers disclose AI drafting and human editing; the sampled Structured AI record identifies sources, access dates and human-edit date. Experimental cluster analysis explicitly relies on model interpretation. No blanket reuse license established. Public reading is not permission to reproduce the database, figures or third-party source material. PDF screenshots and direct downloads failed; figures and layout were not visually verified. The PDF contents heading says version 1.1 while its suggested citation says v1.11; version reconciliation remains unresolved. Some links from the parsed research index resolve with a duplicated research path; a directly addressed sample dossier was readable. No bulk import of company records, source text or graphics.",
              'previous_url':'',
              'source':'https://www.bryanboyer.com/chaindrain/; https://www.bryanboyer.com/chaindrain/research/; https://www.bryanboyer.com/chaindrain/paper.pdf; https://doi.org/10.7302/dspace/30234; https://taubmancollege.umich.edu/news/2026/10/16/tradition-is-not-safe-boyer-urges-new-approaches-to-architecture-and-planning-in-tec-de-monterrey-lecture/; https://www.bryanboyer.com/chaindrain/research/dossier/structured-ai/; https://www.bryanboyer.com/chaindrain/research/thesis-clusters/'
          }
          event = {
              'start_date':'2026-12-03',
              'end_date':'2026-12-03',
              'name':'Not Here, Not Now: Rethinking Speculative Design',
              'city':'Tokyo',
              'country':'Japan',
              'region':'Asia',
              'category':'Speculative, Critical & Futures',
              'description':"University-hosted international symposium at Musashino Art University's Ichigaya campus, 7F Co-Creation Space Ma. Features Anthony Dunne and Fiona Raby, followed by a panel on speculative design with participating researcher Paul Gong. The participant announcement gives 18:00-20:45 JST, English without Japanese interpretation, and a public capacity of 40. University calendar corroborates the date and campus. Reservation required; ticket price, remaining places, livestream and recording availability were not verified.",
              'url':'https://peatix.com/us/event/5247693',
              'source':"Official Musashino Art University Ichigaya event-calendar search-index text confirms December 3, 2026, title and 7F venue: https://ichigaya.musabi.ac.jp/event/ . Paul Gong's first-person announcement, indexed within LinkedIn activity at https://uk.linkedin.com/in/gem-barton-45600122 , supplies program, time, language and capacity. The post is by Gong, not by the profile owner. Direct Peatix retrieval failed. Direct university index returned an older subset than its search-index text. Reviewed November 11, 2026; no registration submitted, no cancellation or actual occurrence inferred, and no reuse rights assumed.",
              'keywords':'Musashino Art University; Not Here Not Now; speculative design; critical design; futures; design education; international symposium; Anthony Dunne; Fiona Raby; Paul Gong; Tokyo; Ichigaya; Co-Creation Space Ma'
          }
          assert not any('chaindrain' in r.get('url','').lower() or 'chain drain' in r['name'].lower() or '10.7302/dspace/30234' in r.get('source','') for r in resources), 'Duplicate research resource'
          assert not any('5247693' in str(r) or ('not here' in r['name'].lower() and r['start_date']=='2026-12-03') for r in events), 'Duplicate symposium'
          assert set(resource)==set(rh) and set(event)==set(eh)
          assert '\u2014' not in resource['description'] and '\u2014' not in event['description']
          for e in events:
              datetime.date.fromisoformat(e['start_date'])
              datetime.date.fromisoformat(e.get('end_date') or e['start_date'])
          expired = [e for e in events if (e.get('end_date') or e['start_date']) < date]
          expected_expired = {'Berlin Science Week 2026: In Touch', 'Stanford d.school Book Talk: Victor Saad, Creative Essentials', 'Nicer Tuesdays LA: November 2026'}
          assert len(expired)==3 and {e['name'] for e in expired}==expected_expired, 'Unexpected retirement set'
          assert all(e['end_date']=='2026-11-10' for e in expired)
          kept_events = [e for e in events if e['name'] not in expected_expired]
          lines = et.splitlines(keepends=True)
          reader = csv.reader(io.StringIO(et,newline=''))
          kept_raw, removed_raw, consumed = [], [], 0
          for index, row in enumerate(reader):
              raw = ''.join(lines[consumed:reader.line_num])
              consumed = reader.line_num
              if index == 0 or not row or not row[0].strip():
                  kept_raw.append(raw)
              elif dict(zip(eh,row))['name'] in expected_expired:
                  removed_raw.append(raw)
              else:
                  kept_raw.append(raw)
          assert consumed==len(lines) and len(removed_raw)==3
          event_base = ''.join(kept_raw)
          assert parse(event_base)[1]==kept_events
          def append(text, head, row):
              out = io.StringIO(newline='')
              csv.writer(out,lineterminator='\n').writerow([row[k] for k in head])
              return text + ('' if text.endswith('\n') else '\n') + out.getvalue()
          new_rt, new_et = append(rt,rh,resource), append(event_base,eh,event)
          assert new_rt.startswith(rt) and new_et.startswith(event_base)
          _, new_resources = parse(new_rt)
          _, new_events = parse(new_et)
          assert new_resources[:-1]==resources and new_events[:-1]==kept_events
          assert all((e.get('end_date') or e['start_date'])>=date for e in new_events)
          tool_count = sum('Research Tool' in [x.strip() for x in r['resource_type'].split(';')] for r in resources)
          before = {'core_resources':len(resources),'research_tools':tool_count,'design_weeks':len(weeks),'dated_events':len(events),'searchable_entries':len(resources)+len(weeks)}
          after = dict(before, core_resources=len(new_resources), dated_events=len(new_events), searchable_entries=len(new_resources)+len(weeks))
          assert after['core_resources']==502 and after['dated_events']==121 and after['searchable_entries']==578
          for old,new in [('**501 core resource records**','**502 core resource records**'),('**501 active research and reference resource records**','**502 active research and reference resource records**'),('**577 searchable entries**','**578 searchable entries**'),('**123 current or forthcoming dated global events**','**121 current or forthcoming dated global events**')]:
              assert md.count(old)==1, f'Unexpected README count: {old}'
              md = md.replace(old,new,1)
          audit = {
              'review_date':date,
              'submitted_urls':['https://www.bryanboyer.com/chaindrain/','https://peatix.com/us/event/5247693'],
              'decision':'Add one combined white-paper/database resource and one university-hosted dated symposium. Retire three elapsed calendar entries by recorded end date. Do not create individual company listings or imply validated outcomes.',
              'before':before,'after':after,'resource':resource,'event':event,
              'research_benchmark':'For future institutional case studies, examine what information, responsibility and evidence survives each transfer between funders, commissioners, researchers, delivery teams and evaluators. This is a proposed application to cultural work, not a finding that the built-environment model is already validated for cultural sectors.',
              'verification_limits':[
                  'Selected PDF text, not a complete independent review of every claim or bibliography item. PDF screenshot rendering and file download failed, so no chart or layout verification claimed.',
                  'Live database says 501 companies/products updated November 8, 2026; older indexed methodology and cluster pages use a smaller dataset. Do not mix their denominators or percentages.',
                  'No independent evaluation of the AI extraction, human-review coverage, coding reliability, model-based clusters or company claims.',
                  'No blanket paper/database reuse license established. DOI and university hosting do not establish peer review or public-domain rights.',
                  'Peatix registration page unavailable. Official university calendar is indexed with the event, but direct retrieval returned an older subset. Participant first-person announcement supplies additional details; price and available places remain unverified.',
                  'No symposium recording or livestream confirmed and no booking submitted.',
                  'Live Reservoir homepage and Events Calendar could not be retrieved. Repository templates and saved data are checked, not interactive rendering.'
              ],
              'retired_events':[{'name':e['name'],'start_date':e['start_date'],'end_date':e['end_date'],'source_url':e['url'],'basis':'Recorded end date before November 11, 2026. This is expiry, not independent confirmation of occurrence or cancellation. Historical record remains in Git history; continuing institutions and archives retained.'} for e in expired],
              'excluded':['Separate entries for companies in Chain Drain','Individual news or podcast mentions','A permanent institution entry for the one-off symposium'],
              'changes':{'resources_added':1,'events_added':1,'resources_removed':0,'events_removed':3,'duplicates_added':0,'website_code_changed':False,'design_weeks_changed':False},
              'validation':'Current blob guards passed for resources, events and README. Full CSV inventories parsed and schema, exact subject/domain duplicates, dates and counts checked. All existing resources and surviving event bytes preserved. Exactly three reviewed elapsed events removed and four README count tokens changed. Prior failed guarded run made no data changes. No HTTP response treated as proof of event occurrence.',
              'sha256_after':{'data/resources.csv':hashlib.sha256(new_rt.encode()).hexdigest(),'data/events.csv':hashlib.sha256(new_et.encode()).hexdigest(),'README.md':hashlib.sha256(md.encode()).hexdigest()}
          }
          rp.write_bytes(new_rt.encode('utf-8'))
          ep.write_bytes(new_et.encode('utf-8'))
          mdp.write_bytes(md.encode('utf-8'))
          review_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'before':before,'after':after,'retired':[e['name'] for e in expired]},indent=2))
          PY
      - name: Commit reviewed data only
        run: |
          git diff --check
          git add data/resources.csv data/events.csv README.md data/chain-drain-musashino-review-2026-11-11.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Chain Drain and Musashino symposium; retire three elapsed November 10 events'
          git push origin HEAD:main
