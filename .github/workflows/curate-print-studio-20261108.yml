name: Curate Print Studio 2026-11-08
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-print-studio-20261108.yml']
permissions:
  contents: write
concurrency:
  group: curate-print-studio-20261108
  cancel-in-progress: false
jobs:
  curate:
    if: github.repository == 'brandiejanow/design-reservoir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified resource without changing existing records
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, pathlib, re
          root = pathlib.Path('.')
          def blob_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          def read_table(path):
              raw = path.read_bytes()
              parsed = list(csv.reader(io.StringIO(raw.decode('utf-8-sig')), strict=True))
              header = parsed[0]
              rows = [r for r in parsed[1:] if r and any(r)]
              assert all(len(r) == len(header) for r in rows), str(path)
              return raw, header, [dict(zip(header, r)) for r in rows]
          def append_record(raw, header, row):
              assert set(row) == set(header)
              out = io.StringIO(newline='')
              writer = csv.DictWriter(out, fieldnames=header, lineterminator='\n')
              writer.writerow(row)
              return raw + (b'' if raw.endswith(b'\n') else b'\n') + out.getvalue().encode()
          paths = {'resources': root/'data/resources.csv', 'workflows': root/'data/research-tool-workflows.csv', 'readme': root/'README.md'}
          expected = {'resources': '6bdfcb55e9fc69e2859f65f92dc9b8daf6e57c00', 'workflows': '59b13f3f968c863cd3ee68ce9cc4b353c8e09c4d', 'readme': '0473ee97768b4308116dda9e4ca990bb32d43fe9'}
          for key, path in paths.items():
              assert blob_sha(path.read_bytes()) == expected[key], 'Concurrent change: ' + str(path)
          raw, header, old = read_table(paths['resources'])
          wraw, wheader, wold = read_table(paths['workflows'])
          event_raw, _, events = read_table(root/'data/events.csv')
          week_raw, _, weeks = read_table(root/'data/design-weeks.csv')
          assert header == ['name','description','url','resource_type','industries','keywords','status','last_checked','audit_note','previous_url','source']
          assert wheader == ['name','workflow']
          assert not any(r['name'].casefold() == 'print studio' or 'rodighiero.github.io/print-studio' in r['url'].lower() or 'github.com/rodighiero/print-studio' in r['url'].lower() for r in old)
          assert not any(r['name'] == 'Print Studio' for r in wold)
          entry = {
          'name': 'Print Studio',
          'description': 'Open-source browser tool maintained by Dario Rodighiero for composing screen-printing separations from collection visualizations. Its current Surprise Machines project represents 213,330 Harvard Art Museums images as colored marks. Supports A2/A3 sheets, one, two or three inks or CMYK, and 300/400 dpi PNG films with a color proof. Useful for teaching print production and communicating collection research; no general dataset-upload interface is documented.',
          'url': 'https://rodighiero.github.io/print-studio/',
          'resource_type': 'Research Tool; Education & Research',
          'industries': 'Graphic & Communication Design; Digital / UX / Product; Arts & Cultural Heritage; Design Education; STEAM',
          'keywords': 'Print Studio; Dario Rodighiero; Surprise Machines; data visualization; screen printing; halftone; color separation; CMYK; printmaking; digital humanities; cultural collections; research communication; PixPlot; UMAP; open-source software',
          'status': 'Verified source',
          'last_checked': '2026-11-08',
          'audit_note': 'README, interface source, package metadata, LICENSE and deployment workflow inspected. GitHub run 42367850502 confirms successful tests, build and Pages deployment on 2026-11-07 at source commit 8e4bac1fe492da9158aa2ebd6849aa11d4514cdf. Live interactive rendering and export were not independently tested because the viewer could not be retrieved. Current interface exposes only Surprise Machines; new collections require source/data adaptation. The related 2022 article supports research provenance, not independent validation of this newer tool or printed output. Code is MIT-licensed; included museum images and metadata are explicitly excluded. Check rights per source asset; no collection-wide reuse permission inferred. High-resolution exports may require several hundred megabytes of memory.',
          'previous_url': '',
          'source': 'https://github.com/rodighiero/print-studio; https://github.com/rodighiero/print-studio/blob/8e4bac1fe492da9158aa2ebd6849aa11d4514cdf/README.md; https://github.com/rodighiero/print-studio/blob/8e4bac1fe492da9158aa2ebd6849aa11d4514cdf/LICENSE; https://github.com/rodighiero/print-studio/actions/runs/42367850502; https://metalab.harvard.edu/p/surprise-machines/; https://doi.org/10.1075/idj.22013.rod'
          }
          new_raw = append_record(raw, header, entry)
          new_wraw = append_record(wraw, wheader, {'name':entry['name'],'workflow':'Analyze & visualize data'})
          old_tools = sum('Research Tool' in [x.strip() for x in r['resource_type'].split(';')] for r in old)
          counts_before = {'resources':len(old),'research_tools':old_tools,'design_weeks':len(weeks),'events':len(events),'searchable_entries':len(old)+len(weeks)}
          counts_after = {**counts_before,'resources':len(old)+1,'research_tools':old_tools+1,'searchable_entries':len(old)+1+len(weeks)}
          readme = paths['readme'].read_text(encoding='utf-8')
          for text, count in [('core resource records',counts_after['resources']),('active research and reference resource records',counts_after['resources']),('searchable entries',counts_after['searchable_entries']),('research tools',counts_after['research_tools'])]:
              readme,n = re.subn(r'\*\*\d+ '+re.escape(text)+r'\*\*', '**'+str(count)+' '+text+'**', readme)
              assert n == 1, (text,n)
          report_path = root/'data/print-studio-review-2026-11-08.json'
          assert not report_path.exists()
          report = {'review_date':'2026-11-08','decision':'Added one research-communication and printmaking tool; no event, institution, article or duplicate collection record added.','resource':entry,'workflow':'Analyze & visualize data','before':counts_before,'after':counts_after,'additions':1,'removals':0,'events_changed':False,'design_weeks_changed':False,'unresolved':['Live browser rendering and export were not independently tested.','No general dataset-upload interface is documented.','Physical screen-printing fidelity and item-level collection reuse permissions were not assessed.'],'provenance':'Print Studio is a newer code project maintained by Dario Rodighiero; the earlier Surprise Machines collaboration and its 2022 article are credited separately. Its UMAP arrangement reflects model-based visual similarity, not historical, geographic or causal relations.','rights':'MIT license applies to code, not all included museum imagery or metadata. Linked article is CC BY 4.0 according to the publisher; that license does not extend to the whole collection. No third-party images, source code or article text copied into Design Reservoir.','validation':'Schema validated; exact name and URL duplication checked across full current resource data. Existing resource and workflow bytes preserved as prefixes. Only four README count tokens changed. Event and design-week files and website code untouched. No manual runtime or print-production test claimed.','source_commit':'8e4bac1fe492da9158aa2ebd6849aa11d4514cdf','sha256_resources_after':hashlib.sha256(new_raw).hexdigest()}
          paths['resources'].write_bytes(new_raw)
          paths['workflows'].write_bytes(new_wraw)
          paths['readme'].write_text(readme,encoding='utf-8')
          report_path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          _, _, final = read_table(paths['resources'])
          _, _, final_workflows = read_table(paths['workflows'])
          assert final == old+[entry]
          assert final_workflows == wold+[{'name':entry['name'],'workflow':'Analyze & visualize data'}]
          assert paths['resources'].read_bytes().startswith(raw)
          assert paths['workflows'].read_bytes().startswith(wraw)
          assert (root/'data/events.csv').read_bytes() == event_raw
          assert (root/'data/design-weeks.csv').read_bytes() == week_raw
          print(json.dumps({'before':counts_before,'after':counts_after,'resource':entry['name']},indent=2))
          PY
      - name: Commit validated data and counts
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.csv data/research-tool-workflows.csv data/print-studio-review-2026-11-08.json README.md
          git commit -m "Add Print Studio with research provenance, limited scope and separate image rights"
          git push origin HEAD:main
