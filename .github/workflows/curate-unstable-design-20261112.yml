name: Curate Unstable Design Lab 2026-11-12
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-unstable-design-20261112.yml']
permissions:
  contents: write
concurrency:
  group: reservoir-unstable-design-20261112
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3
      - name: Apply the reviewed importer with refreshed README guard
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source_commit = '74f9aaa8984e1e4ed3e3dade9bd07872ac087054'
          path = '.github/workflows/curate-unstable-design-20261112.yml'
          workflow = subprocess.check_output(['git','show',source_commit+':'+path], text=True)
          start = "          python3 - <<'PY'\n"
          end = '\n          PY\n'
          assert workflow.count(start)==1 and workflow.count(end)==1
          code = textwrap.dedent(workflow.split(start,1)[1].split(end,1)[0])
          old = "mp:'8a4c382cd49de922eb958d76c904c9efa77947b'"
          new = "mp:'7a09e01b04d0c25e516c2bbad2a8e2fa0acf6628'"
          assert code.count(old)==1
          code = code.replace(old,new,1)
          exec(compile(code, 'reviewed-unstable-design-importer', 'exec'))
          PY
      - name: Commit reviewed records and accounting
        run: |
          git diff --check
          git add data/resources.csv data/events.csv README.md data/unstable-design-review-2026-11-12.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Unstable Design Lab and verified Alongside residency notices'
          git push origin HEAD:main
