name: Audit Design Reservoir links
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-reservoir-link-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check resource, design-week, event and page URLs
        run: python scripts/check_links.py
      - name: Upload full link audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-reservoir-link-report
          path: data/link-audit-latest.json
          if-no-files-found: error
          retention-days: 30
