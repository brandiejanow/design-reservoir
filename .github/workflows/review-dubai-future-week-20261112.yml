name: Review Dubai Future Week 2026-11-12
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-dubai-future-week-20261112.yml']
permissions:
  contents: write
concurrency:
  group: reservoir-dubai-future-week-20261112
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and apply targeted editorial corrections
        run: |
          python3 - <<'PY'
          import csv, io, json, hashlib, subprocess, datetime
          from pathlib import Path
          date = '2026-11-12'
          ep, rp, wp, mdp = map(Path, ['data/events.csv','data/resources.csv','data/design-weeks.csv','README.md'])
          ap = Path('data/dubai-future-week-review-2026-11-12.json')
          assert not ap.exists(), 'Review already applied'
          expected = {ep:'8b5bee1d5a0103146799bf160dbea2ec6b2cb827', mdp:'ebc968a0c5854807846479cc603d209763c67139'}
          for p, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha, f'Concurrent edit: {p}'
          original = {p:p.read_bytes() for p in (ep,rp,wp,mdp,Path('events/index.html'),Path('events/app.js'))}
          def spans(text):
              lines = text.splitlines(keepends=True)
              reader = csv.reader(io.StringIO(text,newline=''))
              result, start = [], 0
              for row in reader:
                  end = reader.line_num
                  result.append((row,''.join(lines[start:end])))
                  start = end
              assert ''.join(x[1] for x in result)==text
              return result
          def parse(raw):
              rows=list(csv.reader(io.StringIO(raw.decode('utf-8'),newline='')))
              head, body=rows[0],[r for r in rows[1:] if r and r[0].strip()]
              assert all(len(r)==len(head) for r in body), 'CSV field mismatch'
              return head,[dict(zip(head,r)) for r in body]
          head, events=parse(original[ep])
          _, resources=parse(original[rp])
          _, weeks=parse(original[wp])
          assert len(events)==122 and len(resources)==503 and len(weeks)==76
          target='Dubai Future Week 2026'
          matches=[r for r in events if r['name']==target]
          assert len(matches)==1
          old=matches[0]
          assert old['start_date']=='2026-11-18' and old['end_date']=='2026-11-21'
          assert old['url']=='https://www.dubaifutureweek.com/en'
          revised=dict(old)
          revised['description']="Dubai Future Foundation gathering at Emirates Towers and the Museum of the Future, combining foresight, university prototypes, public experiences and the inaugural Science, Technology, Arts, and Research Summit (STARS). Registration is offered for the wider week; individual sessions may be public or invitation-only. The separate 500 Future Minds workshop on November 21, 8:30 a.m.-1 p.m. Dubai time, requires approval and Dubai-based professional eligibility. Its published selection-decision date was November 1; late application availability is unconfirmed. General registration does not establish access to restricted sessions. Prices, livestreams and recordings were not confirmed. A mixed public and professional program, not a peer-reviewed conference."
          revised['source']="Official Dubai Future Week homepage, programme, STARS, 500 Future Minds and event terms inspected November 12, 2026. https://www.dubaifutureweek.com/en/programme; https://www.dubaifutureweek.com/en/concepts/stars; https://www.dubaifutureweek.com/en/500-future-minds; https://www.dubaifutureweek.com/en/event-terms . Date and venue also corroborated by Dubai Government Media Office September 1 announcement. No cancellation or postponement notice found in the inspected official material; announced schedule is not proof of future occurrence. No forms submitted, admission inventory tested or blanket reuse permission inferred."
          revised['keywords']='Dubai Future Foundation; Dubai Future Week; STARS; Science Technology Arts and Research Summit; Prototypes for Humanity; 500 Future Minds; futures literacy; strategic foresight; participatory futures; STEAM; architecture; urban planning; education; policy; scientific research; AI; prototypes; art and science; UAE; Dubai; Middle East'
          assert '\u2014' not in revised['description']
          for r in events:
              datetime.date.fromisoformat(r['start_date'])
              datetime.date.fromisoformat(r.get('end_date') or r['start_date'])
          expired=[r for r in events if (r.get('end_date') or r['start_date'])<date]
          assert len(expired)==1 and expired[0]['name']=='Trimble Dimensions 2026' and expired[0]['end_date']=='2026-11-11', 'Unreviewed elapsed records; stop'
          chunks=spans(original[ep].decode('utf-8'))
          kept=[]
          for i,(row,raw) in enumerate(chunks):
              if i==0 or not row or not row[0].strip():
                  kept.append(raw)
                  continue
              record=dict(zip(head,row))
              if record['name']=='Trimble Dimensions 2026':
                  continue
              if record['name']==target:
                  out=io.StringIO(newline='')
                  csv.writer(out,lineterminator='\n').writerow([revised[k] for k in head])
                  kept.append(out.getvalue())
              else:
                  kept.append(raw)
          new_et=''.join(kept).encode('utf-8')
          _, new_events=parse(new_et)
          assert len(new_events)==121
          assert new_events==[revised if r['name']==target else r for r in events if r['name']!='Trimble Dimensions 2026']
          assert sum(r['name']==target for r in new_events)==1
          assert all((r.get('end_date') or r['start_date'])>=date for r in new_events)
          md=original[mdp].decode('utf-8')
          old_count='**122 current or forthcoming dated global events**'
          assert md.count(old_count)==1
          new_md=md.replace(old_count,'**121 current or forthcoming dated global events**',1).encode('utf-8')
          before={'core_resources':len(resources),'design_weeks':len(weeks),'dated_events':len(events),'searchable_entries':len(resources)+len(weeks)}
          after=dict(before,dated_events=len(new_events))
          sources=[
              'https://www.dubaifutureweek.com/en',
              'https://www.dubaifutureweek.com/en/programme',
              'https://www.dubaifutureweek.com/en/concepts/stars',
              'https://www.dubaifutureweek.com/en/500-future-minds',
              'https://www.dubaifutureweek.com/en/event-terms',
              'https://www.mediaoffice.ae/en/news/2026/september/01-09/under-hamdan-bin-mohammeds-directives-dubai-future-week-to-be-held-from-18-to-21-november-2026'
          ]
          audit={
              'review_date':date,
              'submitted_reference':'User screenshot of the Dubai Future Week homepage showing November 18-21, 2026 and Emirates Towers / Museum of the Future.',
              'decision':'Retain and update the existing dated event; no duplicate festival, permanent institution or separate STARS event added. Remove one unrelated elapsed calendar record under standing maintenance rules.',
              'before':before,'after':after,
              'event_before':old,'event_after':revised,
              'verified':[
                  'Current organizer homepage confirms November 18-21, 2026, both venues and Dubai Future Foundation provenance. Dated program items support the announced schedule beyond link reachability.',
                  'STARS is explicitly described as inaugural. Its program combines art, technology and research, with research showcases and announced experiences. Outcomes, audience numbers and future recurrence are not established.',
                  'The homepage distinguishes Open to Public from Invite Only sessions. General registration is not equivalent to access to every activity.',
                  '500 Future Minds is a separate approval-based workshop for Dubai-based professionals on November 21, 8:30 a.m.-1 p.m. Its stated selection-decision date of November 1 has passed. A still-visible Apply link does not verify late applications are being accepted.'
              ],
              'unresolved':[
                  'Admission prices, capacity and remaining availability were not established. No registration or application submitted.',
                  'Livestream and publication of recordings remain unconfirmed. Speaker/exhibitor recording permissions are not a promise of public release.',
                  'The interactive programme returned zero results in parsed text although homepage session listings were visible. No inference of cancellation or an empty programme; app and full interactive schedule not tested.',
                  'No evaluation of individual prototypes, research presentations or learning outcomes was performed.',
                  'Live Reservoir calendar could not be retrieved through the web tool; repository page template reviewed, but live browser rendering not independently tested.'
              ],
              'rights':'Organizer website states all rights reserved. Event terms concern speaker and exhibitor participation and do not provide a public reuse license. Only independently written description and source URLs added. No user image, third-party photographs, recordings or full text copied.',
              'benchmark':'For cultural research and public programming, examine whether public experiences, practitioner deliberation and research presentations produce documented decisions or follow-up work. This is a proposed evaluation question, not evidence that the announced event has already achieved those outcomes.',
              'retired_events':[{'name':r['name'],'start_date':r['start_date'],'end_date':r['end_date'],'source_url':r['url'],'basis':'Recorded end date before November 12, 2026. Removed from active calendar only; original remains in Git history. Not confirmation of occurrence or cancellation.'} for r in expired],
              'excluded':['Duplicate Dubai Future Week event','Separate permanent STARS listing based only on an inaugural announcement','Individual sessions, sponsors and speakers as separate directory resources','A claim that 500 Future Minds applications remain open','A blanket claim of free access or guaranteed recordings'],
              'sources':sources,
              'changes':{'resources_added':0,'resources_updated':0,'resources_removed':0,'events_added':0,'events_updated':1,'events_removed':1,'duplicates_added':0,'website_code_changed':False,'design_weeks_changed':False},
              'validation':'Expected event and README blob hashes matched. Full CSV inventories parsed for row counts, field counts, duplicate target and elapsed dates. Only one event changed and one reviewed elapsed record removed; surviving unrelated record bytes preserved. One README count token updated. Resource data, Design Weeks and website code unchanged.',
              'sha256_after':{'data/events.csv':hashlib.sha256(new_et).hexdigest(),'README.md':hashlib.sha256(new_md).hexdigest()}
          }
          ep.write_bytes(new_et)
          mdp.write_bytes(new_md)
          ap.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for p in original:
              if p not in (ep,mdp):
                  assert p.read_bytes()==original[p]
          print(json.dumps({'before':before,'after':after,'updated':target,'retired':[r['name'] for r in expired]},indent=2))
          PY
      - name: Commit targeted calendar review
        run: |
          git diff --check
          git add data/events.csv README.md data/dubai-future-week-review-2026-11-12.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Dubai Future Week access and STARS details; expire Trimble Dimensions'
          git push origin HEAD:main
