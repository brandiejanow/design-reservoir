name: One-time professional organization curation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curation-organizations-20261105.yml'
      - 'scripts/import_professional_organizations_20261105.py'
      - 'data/professional-organizations-candidates-2026-11-05.json'
permissions:
  contents: write
concurrency:
  group: professional-organization-curation-20261105
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified additions when both import files are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/import_professional_organizations_20261105.py || ! -f data/professional-organizations-candidates-2026-11-05.json ]]; then
            echo 'Import preparation only; no directory changes.'
            exit 0
          fi
          python3 scripts/import_professional_organizations_20261105.py
          if ! git diff --quiet -- data/resources.csv README.md || [[ -n "$(git ls-files --others --exclude-standard data/professional-organizations-review-2026-11-05.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/resources.csv README.md data/professional-organizations-review-2026-11-05.json
            git commit -m 'Add verified professional organizations and credential issuers from curator review'
            git push origin HEAD:main
          else
            echo 'Reviewed entries already present; no directory changes.'
          fi
