name: Curate Norient resource and residency 2026-11-09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curate-norient-20261109.yml']
permissions:
  contents: write
concurrency:
  group: reservoir-norient-20261109
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and apply source-reviewed records
        run: |
          python3 - <<'PY'
          import csv, datetime as dt, hashlib, io, json
          from pathlib import Path
          from urllib.parse import urlsplit
          date = '2026-11-09'
          audit_path = Path('data/norient-review-2026-11-09.json')
          assert not audit_path.exists(), 'Review already applied; refusing duplicate write.'
          paths = ['data/resources.csv', 'data/events.csv', 'data/design-weeks.csv', 'README.md', 'index.html', 'events/index.html', 'app.js', 'events/app.js', 'data/research-tool-workflows.csv', 'data/design-atlas.csv']
          original = {p: Path(p).read_bytes() for p in paths}
          expected = {'data/resources.csv':'f1f24cfd7fc78300cf55800396feae4e6beee393','data/events.csv':'96107359aba812797b7a648a13fa45c95850f5a3','README.md':'fd70c29c9f3dbbb7330fa25f7be3366329799ff9','index.html':'edd4474c4889bd4aeecd028c6d1e026d7c97e8b1','events/index.html':'b626b9a70fdb93825d1ac0513bfaffde26c6c228'}
          for p, sha in expected.items():
              b = original[p]
              actual = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
              assert actual == sha, f'{p} changed since inspection; stop instead of overwriting concurrent work.'
          def parse(data):
              rows = list(csv.reader(io.StringIO(data.decode('utf-8'), newline='')))
              rows = [r for r in rows if r and r[0].strip()]
              head = rows[0]
              assert all(len(r) == len(head) for r in rows[1:]), 'CSV schema mismatch'
              return head, [dict(zip(head, r)) for r in rows[1:]]
          rh, resources = parse(original['data/resources.csv'])
          eh, events = parse(original['data/events.csv'])
          wh, weeks = parse(original['data/design-weeks.csv'])
          assert (len(resources), len(events), len(weeks)) == (497,120,76)
          assert rh == 'name,description,url,resource_type,industries,keywords,status,last_checked,audit_note,previous_url,source'.split(',')
          assert eh == 'start_date,end_date,name,city,country,region,category,description,url,source,keywords'.split(',')
          for collection in [resources, events, weeks]:
              assert not any('norient' in (r.get('name','')+' '+r.get('url','')).casefold() for r in collection), 'Existing Norient record requires reconciliation, not append.'
          resource = {
              'name':'Norient: Sound, Culture and Research',
              'description':'Independent Swiss publishing and curatorial platform examining music, sound and cultural life through essays, podcasts, films, photography and research. Its collections include Norient City Sounds, TIMEZONES and the Norient Academic Online Journal archive, with named contributors and editors. Public material coexists with paid membership for archive search and selected digital publications; books and event participation have separate terms.',
              'url':'https://norient.com/specials',
              'resource_type':'Research & Reference; Archive & Collection; Media & Publications',
              'industries':'Arts & Cultural Heritage; Academic Research; Research, History & Education; Creative Industries; Cross-disciplinary Design',
              'keywords':'Norient; sound studies; cultural research; soundscapes; listening; music; audiovisual research; ethnomusicology; cultural memory; curatorial practice; digital publications; sonic archives; cultural production; storytelling; Switzerland',
              'status':'Verified source',
              'last_checked':date,
              'audit_note':'Official About, digital publications, academic archive, membership and 2027 residency call inspected. Current operation supported by dated 2026 collections and the organizer-linked 2027 application form. An independent mixed-format publisher and research reference, not a university or a claim that every contribution is peer reviewed. Historical journal material remains an archive; no current journal issue schedule assumed. Membership is required for archive search and some digital publications; do not describe the entire site as freely accessible. No blanket reuse license established; check each author, recording, image and publication. Planned Manuals for the Future is not yet a completed publication. The first 2027 Forum is not assumed to be annual. No third-party texts, images or audio copied.',
              'previous_url':'',
              'source':'https://norient.com/about; https://norient.com/specials; https://norient.com/specials/norient-academic-online-journal; https://norient.com/become-member; https://norient.com/dust-and-frequencies; https://norient.com/norient-forum-2027-call-for-two-residencies'
          }
          event = {
              'start_date':'2026-11-30',
              'end_date':'2026-11-30',
              'name':'Norient Forum 2027 Residencies: Application Deadline',
              'city':'Online submission',
              'country':'Online',
              'region':'Online',
              'category':'Arts & Cultural Heritage',
              'description':'Deadline for two selected residencies in Bern, Switzerland, March 1-19, 2027. Open worldwide to applicants under 35 working with music, sound or noise through writing, podcasts, film, photography or other media; English-language Forum. Travel and shared accommodation covered, plus CHF 2,000 for both the residency and approximately two additional working weeks remotely. Residents co-host the March 11-13 Forum and co-produce Manuals for the Future, planned for September 2027. Apply with a CV, short bio, one-minute video and a PDF with up to three work samples. Deadline time and time zone unspecified; meals, visa costs and insurance coverage not established.',
              'url':'https://norient.com/norient-forum-2027-call-for-two-residencies',
              'source':'Norient official 2027 call and organizer-linked application form verified 2026-11-09. https://form.jotform.com/263065146193053 Notification December 23, 2026. No application submitted. Funding is stated by component rather than described as all expenses paid; project ownership and publication terms require organizer clarification.',
              'keywords':'Norient; residency; application deadline; music; sound; cultural research; audiovisual storytelling; artistic research; emerging practitioners; under 35; Bern; Switzerland; cultural publishing; Manuals for the Future; 2027'
          }
          for row, head in [(resource,rh),(event,eh)]:
              assert set(row) == set(head)
              assert all(isinstance(row[k],str) for k in head)
              assert '\u2014' not in row['description']
              assert urlsplit(row['url']).scheme == 'https'
          assert dt.date.fromisoformat(event['end_date']) >= dt.date.fromisoformat(date)
          def append(data, row, head):
              out = io.StringIO(newline='')
              csv.writer(out, lineterminator='\n').writerow([row[k] for k in head])
              result = data + (b'' if data.endswith(b'\n') else b'\n') + out.getvalue().encode('utf-8')
              assert result.startswith(data)
              return result
          new_r = append(original['data/resources.csv'],resource,rh)
          new_e = append(original['data/events.csv'],event,eh)
          _, checked_r = parse(new_r)
          _, checked_e = parse(new_e)
          assert checked_r[:-1] == resources and checked_r[-1] == resource
          assert checked_e[:-1] == events and checked_e[-1] == event
          tools = sum('Research Tool' in [v.strip() for v in x['resource_type'].split(';')] for x in resources)
          before = {'resources':len(resources),'research_tools':tools,'design_weeks':len(weeks),'events':len(events),'searchable_entries':len(resources)+len(weeks)}
          after = {**before,'resources':len(checked_r),'events':len(checked_e),'searchable_entries':len(checked_r)+len(weeks)}
          md = original['README.md'].decode('utf-8')
          substitutions = [('**497 core resource records**','**498 core resource records**'),('**497 active research and reference resource records**','**498 active research and reference resource records**'),('**573 searchable entries**','**574 searchable entries**'),('**120 current or forthcoming dated global events**','**121 current or forthcoming dated global events**')]
          for old,new in substitutions:
              assert md.count(old) == 1, f'Unexpected README count: {old}'
              md = md.replace(old,new,1)
          expired = [e['name'] for e in events if dt.date.fromisoformat(e['end_date'] or e['start_date']) < dt.date.fromisoformat(date)]
          audit = {
              'review_date':date,
              'submitted_discovery_url':'https://www.globalsouthopportunities.com/2026/11/09/residency-4/',
              'decision':'Add one continuing Norient publication and research collection and one dated residency application deadline, using original publisher URLs rather than the aggregator.',
              'before':before,'after':after,
              'resource':resource,'event':event,
              'verification':{'discovery':'Exact aggregator article identified from indexed text after direct retrieval returned 403. Primary call and its linked application form were directly readable.','original_sources':'Norient About, current homepage, digital-publication collection, academic archive, membership page, Dust and Frequencies collection, official residency call and organizer-linked Jotform read.','participation':'Two places; applicants under 35 worldwide; music/sound-related practice and English-language participation. Three weeks in Bern, online preparation and about two additional working weeks remotely. Notification December 23, 2026.','funding':'Organizer covers travel and accommodation and pays CHF 2,000 for the residency and follow-up work together. Shared lodging at PROGR. No claim of a monthly stipend or coverage of every living, visa or insurance cost.','application':'CV, approximately 75-word biography, one-minute motivation video and PDF containing up to three work samples with dates and roles. Optional portrait/practice images requested with credits for announcing selected residents. No form submitted or personal information transferred.','currency':'Application deadline confirmed as November 30, 2026 in both official call and linked form. First Forum dates March 11-13, 2027; residency March 1-19. Dates do not establish that any future event has occurred.','rights':'No blanket license found for Norient collections or residency outputs. Reviewed pages do not resolve all project ownership/publication terms. No copyrighted media reproduced.','live_reservoir':'Live homepage and Events Calendar could not be retrieved through browser tool. Repository page templates inspected; interactive rendering not verified.'},
              'unresolved':['Deadline cutoff time and time zone are unspecified.','Meals, visa costs, insurance, payment timing and output-ownership terms not established.','Form asks video links to remain active through end of December but prints the year as 20206; not used as a definitive extra deadline.','No separate public Forum ticket or registration terms reviewed.','Manuals for the Future is planned for September 2027, not a currently available publication.'],
              'not_added':['Aggregator article as a permanent resource','Separate entries for each article, podcast or academic archive volume','A second calendar record for the selected residency period','Standalone Forum attendance listing without reviewed public admission details','Planned Manuals for the Future publication'],
              'reviewer_benchmark':'Documenting the relationships between a creative brief, collaborative event work and an attributed publication can inform cultural-program evaluation. Norient\'s editorial model is a possible reference, not evidence that every resident or audience gains particular outcomes.',
              'changes':{'resources_added':1,'events_added':1,'resources_removed':0,'events_removed':0,'duplicates_added':0,'website_code_changed':False,'design_weeks_changed':False},
              'existing_events_past_recorded_end_date':expired,
              'validation':'Current resource and event blob hashes matched pre-review values. Full CSV inventories parsed and schema validated; no Norient name or domain duplication. All pre-existing resource and event bytes preserved. Four README count tokens changed. Other files untouched. Source reachability not treated as proof of occurrence.',
              'sha256_after':{'data/resources.csv':hashlib.sha256(new_r).hexdigest(),'data/events.csv':hashlib.sha256(new_e).hexdigest(),'README.md':hashlib.sha256(md.encode()).hexdigest()}
          }
          Path('data/resources.csv').write_bytes(new_r)
          Path('data/events.csv').write_bytes(new_e)
          Path('README.md').write_bytes(md.encode('utf-8'))
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for p in paths:
              if p not in ['data/resources.csv','data/events.csv','README.md']:
                  assert Path(p).read_bytes() == original[p]
          print(json.dumps({'before':before,'after':after,'existing_expired':expired},indent=2))
          PY
      - name: Commit reviewed records and accounting
        run: |
          git diff --check
          git add data/resources.csv data/events.csv README.md data/norient-review-2026-11-09.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Norient sound-culture reference and verified November 30 residency deadline'
          git push origin HEAD:main
