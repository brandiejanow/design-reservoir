<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Past Events Archive | Design Reservoir</title><link rel="stylesheet" href="../styles.css"></head>
<body><main style="max-width:1000px;margin:3rem auto;padding:0 1.5rem;font-family:inherit"><p><a href="../">Design Reservoir</a> / <a href="../events/">Events</a></p><h1>Past Events Archive</h1><p>A historical record of completed design, architecture, futures and STEAM events. Events are archived after their end date, not when they begin. Canceled and postponed events require separate status verification.</p><label for="search">Search archived events</label> <input id="search" type="search" placeholder="Name, location or year" style="padding:.6rem;max-width:100%;width:26rem"><p id="count" aria-live="polite"></p><div id="results"></div></main><script>
function csv(s){const out=[];let row=[],v="",q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);v="";if(row.some(Boolean))out.push(row);row=[]}else v+=c}if(v||row.length){row.push(v);out.push(row)}const head=out.shift()||[];return out.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||""])));}
let events=[];const result=document.getElementById("results"),count=document.getElementById("count");function render(){const q=document.getElementById("search").value.toLowerCase();const found=events.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q));count.textContent=found.length+" archived events";result.replaceChildren();for(const e of found){const article=document.createElement("article");article.style.cssText="padding:1rem 0;border-bottom:1px solid #999";const h=document.createElement("h2");h.textContent=e.name;article.append(h);const p=document.createElement("p");p.textContent=[e.start_date+(e.end_date&&e.end_date!==e.start_date?" to "+e.end_date:""),e.city,e.country].filter(Boolean).join(" · ");article.append(p);if(e.url){const link=document.createElement("a");link.href=e.url;link.textContent="Official event website";link.rel="noopener noreferrer";article.append(link)}result.append(article)}}
fetch("../data/events-archive.csv",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Archive unavailable");return r.text()}).then(s=>{events=csv(s);render()}).catch(e=>count.textContent=e.message);document.getElementById("search").addEventListener("input",render);
</script></body></html>
